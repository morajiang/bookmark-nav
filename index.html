<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#FFF6EC;color:#1C1C1C;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
 -webkit-font-smoothing:antialiased;display:grid;place-items:center}
.card{background:#fff;border-radius:26px;padding:38px 40px 32px;width:min(430px,92vw);
 box-shadow:0 18px 40px rgba(150,110,50,.14),0 3px 10px rgba(150,110,50,.08);text-align:center}
.lock{width:44px;height:44px;margin:0 auto 14px;color:#FFB000}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.01em}
.hl{position:relative;z-index:0;display:inline-block}
.hl::after{content:"";position:absolute;left:-6px;right:-8px;bottom:.08em;height:.34em;
 background:#FFD84D;border-radius:4px;transform:rotate(-1.5deg);z-index:-1}
p{margin:10px 0 0;color:#8A8279;font-size:13px}
.row{display:flex;gap:8px;margin-top:22px}
input{flex:1;border:1px solid rgba(28,28,28,.14);border-radius:999px;padding:12px 16px;
 font:inherit;font-size:15px;font-weight:600;outline:0;min-width:0}
input:focus{border-color:#FFB000;box-shadow:0 0 0 3px rgba(255,176,0,.15)}
button{border:0;background:#1C1C1C;color:#fff;border-radius:999px;padding:0 20px;
 font:inherit;font-weight:800;cursor:pointer;transition:background .15s ease}
button:hover{background:#333}
.msg{margin-top:14px;font-size:12.5px;color:#B3AAA0;min-height:18px}
.msg.err{color:#E1301A;font-weight:700}
.hide{display:none!important}
.busy{color:#8A8279;font-size:14px;font-weight:600}
</style>
</head>

function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function tryUnlock(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:210000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
  return new TextDecoder().decode(pt);
}
const pw=document.getElementById('pw'),ok=document.getElementById('ok'),msg=document.getElementById('msg');
async function unlock(pass,save,auto){
  try{
    document.getElementById('gate').classList.add('hide');
    document.getElementById('busy').classList.remove('hide');
    const html=await tryUnlock(pass);
    try{localStorage.setItem('nav_unlock',pass);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('busy').classList.add('hide');
    document.getElementById('gate').classList.remove('hide');
    if(auto){
      msg.textContent='第一次打开需要输入；本机会自动记住';
      msg.classList.remove('err');
    }else{
      msg.textContent='口令不对，请再试一次';
      msg.classList.add('err');
    }
  }
}
ok.addEventListener('click',()=>{const v=pw.value.trim();if(v)unlock(v,true);});
pw.addEventListener('keydown',e=>{if(e.key==='Enter')ok.click();});
let saved=null;try{saved=localStorage.getItem('nav_unlock');}catch(e){}
if(saved){unlock(saved,true,true);}else{pw.focus();}
</script>
